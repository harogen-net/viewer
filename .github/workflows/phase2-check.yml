name: Phase2 Checks

on:
  pull_request:
  push:
    branches:
      - develop2

jobs:
  phase2-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run phase2 checks
        run: npm run check:phase2
