<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script type="module" src="src/index.ts"></script>
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <title>Viewer</title>
  </head>
  <body>
    <div id="wrapper">
      <div id="pref"></div>
      <div id="images"></div>
      <div id="menu" class="menu"></div>
      <div id="main">
        <div class="canvas">
          <div class="menu"></div>
          <div class="sideMenu">
            <div class="property">
              <div>
                <dl class="position">
                  <dt>position</dt>
                  <dd><input type="text" value="0" /></dd>
                  <dd><input type="text" value="0" /></dd>
                </dl>
                <dl class="scale">
                  <dt>scale</dt>
                  <dd><input type="text" value="1" /></dd>
                  <dd>
                    <button class="mirrorH" data-desc="flip selected image horizontally"><i class="fas fa-arrows-alt-h"></i></button
                    ><button class="mirrorV" data-desc="flip selected image vertically"><i class="fas fa-arrows-alt-v"></i></button>
                  </dd>
                </dl>
                <dl class="rotation">
                  <dt>
                    rotation<button class="resetRotation"><i class="fas fa-times"></i></button>
                  </dt>
                  <dd><input type="text" value="0" /></dd>
                </dl>
                <dl class="opacity">
                  <dt>
                    opacity<button class="resetOpacity"><i class="fas fa-times"></i></button>
                  </dt>
                  <dd><input type="text" value="1" /></dd>
                  <dd>
                    <button class="isText" data-desc="this image contains text"><i class="far fa-image"></i><i class="fas fa-font"></i></button>
                  </dd>
                </dl>
                <dl class="clip">
                  <dt>
                    clip<button class="resetClip"><i class="fas fa-times"></i></button>
                  </dt>
                  <dd><input type="text" value="0" /></dd>
                  <dd><input type="text" value="0" /></dd>
                  <dd><input type="text" value="0" /></dd>
                  <dd><input type="text" value="0" /></dd>
                </dl>
              </div>
              <div class="copypaste">
                <button class="copyTrans" title="変形をコピー"><i class="fas fa-clipboard"></i></button>
                <button class="pasteTrans" title="変形をペースト"><i class="far fa-clipboard"></i></button>
              </div>
              <div class="imageRef">
                <button class="imageRef">
                  <span><i class="fas fa-file-image"></i> IMG REF. </span> <label for="cb_imageRef"><input id="cb_imageRef" type="checkbox" /><span>forALL</span></label>
                </button>
                <input class="imageRef" type="file" value="" accept="image/*" />
                <button class="download"><i class="fas fa-file-download"></i></button>
              </div>
              <div class="textEdit">
                <textarea spellcheck="false"></textarea>
              </div>
              <div class="swap">
                <button class="bottom"><i class="fas fa-arrow-circle-down"></i></button><button class="down"><i class="fas fa-arrow-down"></i></button
                ><button class="up"><i class="fas fa-arrow-up"></i></button><button class="top"><i class="fas fa-arrow-circle-up"></i></button>
              </div>
            </div>
            <div class="layer">
              <ul></ul>
            </div>
          </div>
        </div>
        <div class="list">
          <ul id="slideContextMenu" class="contextMenu menu">
            <li>
              <button class="delete"><i class="far fa-trash-alt"></i> <span>delete this slide</span></button>
            </li>
            <li>
              <button class="enable"><i class="far fa-check-square"></i> <span>enable only this slide</span></button>
            </li>
          </ul>
          <ul id="listContextMenu" class="contextMenu menu">
            <li>
              <button class="unjoin"><i class="fas fa-unlink"></i> <span>toggle joining all slides</span></button>
            </li>
            <li>
              <button class="delete"><i class="far fa-trash-alt"></i> <span>delete disabled slides</span></button>
            </li>
            <li>
              <button class="enable"><i class="far fa-check-square"></i> <span>enable all slides</span></button>
            </li>
            <li>
              <button class="disable"><i class="far fa-square"></i> <span>disable all slides</span></button>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div id="appNotice" role="status" aria-live="polite"></div>
  </body>
</html>
